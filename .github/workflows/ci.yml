name: CI

on:
  pull_request:
  push:
    branches: [dev/orbit-ci-pytest]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg  # matplotlib backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5 # I found this tool really helped in the spacenet

      - name: Install dependencies
        run: uv sync --extra dev --locked  # fails if uv.lock is out of sync with pyproject.toml

      - name: Run tests
        run: uv run pytest -v -rs  # verbose, lists skipped tests