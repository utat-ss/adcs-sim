name: CI
on: 
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs_on: ubuntu-latest
    env:
      MPLBACKEND: Agg # matplotlib backend
    steps:
     - uses: actions/checkout@v4
     - name: Install uv
       uses: astral-sh/setup-uv@v5 # high precision python toolings
     - name: Install dependencies
       run: uv sync --extra dev --locked # fails the job if uv.lock is out of sync with pyproject.toml.
     - name: Run tests
       run: uv run pytest -v -rs # verbose testing, lists skipped tests in the log.


